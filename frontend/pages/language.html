<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Language – TourEase</title>
  <link rel="stylesheet" href="/static/frontend/css/style.css"/>
</head>
<body>

<nav>
  <a class="logo" href="/">🌍 TourEase</a>
  <ul>
    <li><a href="/">Home</a></li>
    <li><a href="/pages/weather.html">Weather</a></li>
    <li><a href="/pages/safety.html">Safety</a></li>
    <li><a href="/pages/food.html">Food</a></li>
    <li><a href="/pages/language.html">Language</a></li>
    <li><a href="/pages/booking.html">Booking</a></li>
    <li><a href="#" id="navUser" style="color:#fff; font-weight:700;"></a></li>
    <li><a href="#" onclick="logout()" style="background:rgba(255,255,255,0.15); border-radius:20px;">Logout</a></li>
  </ul>
</nav>

<div class="page-header">
  <h1>🌐 Language Guide</h1>
  <p>Translate text and learn common tourist phrases</p>
</div>

<div class="section">

  <!-- Translator -->
  <h2 class="section-title">Translator</h2>
  <div class="form-card">
    <div class="form-group">
      <label>Text to Translate</label>
      <input type="text" id="translateText" placeholder="e.g. Where is the hotel?"/>
    </div>
    <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
      <div class="form-group">
        <label>From</label>
        <select id="sourceLang">
          <option value="en">English</option>
          <option value="hi">Hindi</option>
          <option value="ta">Tamil</option>
          <option value="te">Telugu</option>
        </select>
      </div>
      <div class="form-group">
        <label>To</label>
        <select id="targetLang">
          <option value="ta">Tamil</option>
          <option value="hi">Hindi</option>
          <option value="te">Telugu</option>
          <option value="ml">Malayalam</option>
          <option value="kn">Kannada</option>
          <option value="fr">French</option>
          <option value="de">German</option>
          <option value="ja">Japanese</option>
          <option value="zh">Chinese</option>
          <option value="es">Spanish</option>
          <option value="ar">Arabic</option>
        </select>
      </div>
    </div>
    <button class="btn btn-primary" onclick="translateText()">Translate</button>
    <div id="translateResult" style="margin-top:1rem;"></div>
  </div>

  <!-- Common Phrases -->
  <h2 class="section-title" style="margin-top:2.5rem;">Common Tourist Phrases</h2>
  <div class="form-card" style="margin:0 0 1.5rem;">
    <div class="form-group">
      <label>Select Language</label>
      <select id="phraseLang">
        <option value="ta">Tamil</option>
        <option value="hi">Hindi</option>
        <option value="te">Telugu</option>
      </select>
    </div>
    <button class="btn btn-primary" onclick="loadPhrases()">Get Phrases</button>
  </div>
  <div id="phraseList"></div>

</div>

<footer>© 2025 TourEase</footer>

<script src="/static/frontend/js/api.js"></script>
<script>
  if (!sessionStorage.getItem("tourease_user")) { window.location.href = "/login"; }
  else { const u = JSON.parse(sessionStorage.getItem("tourease_user")); const el = document.getElementById("navUser"); if(el) el.textContent = "👤 " + (u.name||u.email); }
  function logout() { sessionStorage.removeItem("tourease_user"); window.location.href = "/login"; }
  async function translateText() {
    const text = document.getElementById("translateText").value.trim();
    const source_lang = document.getElementById("sourceLang").value;
    const target_lang = document.getElementById("targetLang").value;
    const box = document.getElementById("translateResult");

    if (!text) { box.innerHTML = `<div class="alert alert-error">Enter text to translate.</div>`; return; }
    box.innerHTML = `<div class="alert alert-info">Translating...</div>`;

    const data = await api.post("/language/translate", { text, source_lang, target_lang });
    if (data.error) { box.innerHTML = `<div class="alert alert-error">${data.error}</div>`; return; }

    box.innerHTML = `
      <div class="result-box" style="margin-top:0;">
        <p style="color:#888; font-size:0.85rem;">Original</p>
        <p style="font-size:1.1rem; margin:4px 0 12px;">${data.original}</p>
        <p style="color:#888; font-size:0.85rem;">Translated</p>
        <p style="font-size:1.4rem; font-weight:700; color:var(--primary);">${data.translated}</p>
      </div>`;
  }

  async function loadPhrases() {
    const lang = document.getElementById("phraseLang").value;
    const data = await api.get(`/language/phrases/${lang}`);
    const list = document.getElementById("phraseList");

    if (data.error) { list.innerHTML = `<div class="alert alert-error">${data.error}</div>`; return; }

    list.innerHTML = `
      <div class="result-box">
        <h3>${data.language} Phrases</h3>
        <table style="margin-top:1rem;">
          <thead><tr><th>English</th><th>${data.language}</th></tr></thead>
          <tbody>
            ${Object.entries(data.phrases).map(([en, local]) =>
              `<tr><td>${en}</td><td style="font-size:1.1rem;">${local}</td></tr>`
            ).join("")}
          </tbody>
        </table>
      </div>`;
  }
</script>
</body>
</html>
