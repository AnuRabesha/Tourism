<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food – TourEase</title>
  <link rel="stylesheet" href="/static/frontend/css/style.css"/>
  <style>
    body { background: linear-gradient(135deg, #fffbeb 0%, #fce7f3 50%, #f0e7ff 100%) fixed; }
    .page-header { background: linear-gradient(135deg, #d97706, #f59e0b, #ef4444, #db2777); }
    .card { border-top: 3px solid; border-image: linear-gradient(90deg,#f59e0b,#ef4444) 1; }
    .card .icon, .card > div[style*="font-size:2rem"] { filter: drop-shadow(0 4px 8px rgba(245,158,11,0.45)); }
    .btn-primary { background: linear-gradient(135deg,#f59e0b,#ef4444); border: none; }
    .btn-outline { border-color: #d97706; color: #d97706; }
    .result-box h3 { background: linear-gradient(90deg,#d97706,#ef4444); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .badge-low { background: linear-gradient(135deg,#d1fae5,#a7f3d0); color: #065f46; }
    footer { background: linear-gradient(135deg,#1e1b4b,#4c1d95); }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="/">🌍 TourEase</a>
  <ul>
    <li><a href="/">Home</a></li>
    <li><a href="/pages/weather.html">Weather</a></li>
    <li><a href="/pages/safety.html">Safety</a></li>
    <li><a href="/pages/food.html">Food</a></li>
    <li><a href="/pages/language.html">Language</a></li>
    <li><a href="/pages/booking.html">Booking</a></li>
    <li><a href="/pages/alerts.html" style="background:rgba(220,38,38,0.25);border-radius:20px;">?? Alerts</a></li>`n    <li><a href="#" id="navUser" style="color:#fff; font-weight:700;"></a></li>
    <li><a href="#" onclick="logout()" style="background:rgba(255,255,255,0.15); border-radius:20px;">Logout</a></li>
  </ul>
</nav>

<div class="page-header">
  <h1>🍲 Food Guide</h1>
  <p>Discover free temple food and famous local dishes across India</p>
</div>

<div class="section">

  <!-- Tabs -->
  <div style="display:flex; gap:1rem; margin-bottom:1.5rem;">
    <button class="btn btn-primary" onclick="showTab('temple')">🛕 Temple Food</button>
    <button class="btn btn-outline" onclick="showTab('dishes')">🍛 Famous Dishes</button>
    <button class="btn btn-outline" onclick="showTab('instant')">⚡ Instant Foods</button>
  </div>

  <!-- Temple Food -->
  <div id="templeTab">
    <div class="form-card" style="margin:0 0 1.5rem;">
      <div class="form-group">
        <label>Filter by State (optional)</label>
        <input type="text" id="templeState" placeholder="e.g. TN, Punjab"/>
      </div>
      <button class="btn btn-primary" onclick="loadTemples()">Search</button>
    </div>
    <div id="templeList" class="cards-grid"></div>
  </div>

  <!-- Famous Dishes -->
  <div id="dishesTab" style="display:none;">
    <div class="form-card" style="margin:0 0 1.5rem;">
      <div class="form-group">
        <label>Select State</label>
        <select id="stateSelect">
          <option value="">-- All States --</option>
          <option>Tamil Nadu</option>
          <option>Kerala</option>
          <option>Punjab</option>
          <option>Rajasthan</option>
          <option>West Bengal</option>
          <option>Maharashtra</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="loadDishes()">Get Dishes</button>
    </div>
    <div id="dishesList"></div>
  </div>

  <!-- Instant Foods -->
  <div id="instantTab" style="display:none;">
    <div class="form-card" style="margin:0 0 1.5rem;">
      <div class="form-group">
        <label>City</label>
        <select id="instantCity">
          <option value="">-- All Cities --</option>
          <option>Chennai</option>
          <option>Madurai</option>
          <option>Coimbatore</option>
          <option>Tiruvannamalai</option>
          <option>Rameswaram</option>
          <option>Ooty</option>
          <option>Alleppey</option>
          <option>Jaisalmer</option>
        </select>
      </div>
      <button class="btn btn-primary" onclick="loadInstantFoods()">Get Instant Foods</button>
    </div>
    <div id="instantList"></div>
  </div>

</div>

<footer>© 2025 TourEase</footer>

<script src="/static/frontend/js/api.js"></script>
<script>
  if (!sessionStorage.getItem("tourease_user")) { window.location.href = "/login"; }
  else { const u = JSON.parse(sessionStorage.getItem("tourease_user")); const el = document.getElementById("navUser"); if(el) el.textContent = "👤 " + (u.name||u.email); }
  function logout() { sessionStorage.removeItem("tourease_user"); window.location.href = "/login"; }
  function showTab(tab) {
    document.getElementById("templeTab").style.display = tab === "temple" ? "block" : "none";
    document.getElementById("dishesTab").style.display = tab === "dishes" ? "block" : "none";
    document.getElementById("instantTab").style.display = tab === "instant" ? "block" : "none";
  }

  async function loadTemples() {
    const state = document.getElementById("templeState").value.trim();
    const url = state ? `/food/temple-food?state=${encodeURIComponent(state)}` : "/food/temple-food";
    const data = await api.get(url);
    const list = document.getElementById("templeList");
    // Guard: api error or non-array response
    if (data.error || !Array.isArray(data)) {
      list.innerHTML = `<div class="alert alert-error">${data.error || "Failed to load temple data."}</div>`;
      return;
    }
    if (!data.length) { list.innerHTML = `<div class="alert alert-info">No temples found.</div>`; return; }
    list.innerHTML = data.map(t => `
      <div class="card" style="text-align:left; padding:1.2rem;">
        <div style="font-size:2rem; text-align:center;">${t.religion === 'Hindu' ? '🛕' : t.religion === 'Muslim' ? '🕌' : '⛪'}</div>
        <h3 style="margin:8px 0 4px; font-size:0.95rem;">${t.name}</h3>
        <p style="font-size:0.8rem; color:#666;">📍 ${t.location}</p>
        <p style="font-size:0.78rem; color:#888; margin-top:4px;">⏰ Open: ${t.timings}</p>
        ${t.food_timings ? `
        <div style="margin-top:10px; border-top:1px solid #eee; padding-top:8px;">
          <p style="font-size:0.8rem; font-weight:700; color:var(--primary); margin-bottom:6px;">🍽️ Food Timings:</p>
          ${t.food_timings.map(f => `
            <div style="background:#f8f9fa; border-radius:6px; padding:6px 8px; margin-bottom:4px; font-size:0.78rem;">
              <b>${f.meal}</b>: ${f.time}<br/>
              <span style="color:#666;">${f.items}</span>
            </div>`).join("")}
        </div>` : `<p style="font-size:0.78rem; color:#999; margin-top:8px;">ℹ️ Confirm timings locally</p>`}
        <span class="badge badge-low" style="margin-top:8px; display:inline-block;">FREE ${t.verified ? '✅' : ''}</span>
      </div>
    `).join("");
  }

  async function loadDishes() {
    const state = document.getElementById("stateSelect").value;
    const url = state ? `/food/famous-dishes?state=${encodeURIComponent(state)}` : "/food/famous-dishes";
    const data = await api.get(url);
    const list = document.getElementById("dishesList");

    if (data.error) {
      list.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
      return;
    }

    if (state && data.dishes) {
      list.innerHTML = `
        <div class="result-box">
          <h3>🍛 ${data.state}</h3>
          <div class="cards-grid" style="margin-top:1rem;">
            ${data.dishes.map(d => `<div class="card"><div class="icon">🍽️</div><h3>${d}</h3></div>`).join("")}
          </div>
        </div>`;
    } else {
      list.innerHTML = Object.entries(data).map(([s, dishes]) => `
        <div class="result-box" style="margin-bottom:1rem;">
          <h3>📍 ${s}</h3>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;">
            ${dishes.map(d => `<span class="badge badge-medium">${d}</span>`).join("")}
          </div>
        </div>`).join("");
    }
  }

  async function loadInstantFoods() {
    const city = document.getElementById("instantCity").value;
    const url = city ? `/food/instant-foods?city=${encodeURIComponent(city)}` : "/food/instant-foods";
    const data = await api.get(url);
    const list = document.getElementById("instantList");
    if (data.error) { list.innerHTML = `<div class="alert alert-error">${data.error}</div>`; return; }
    if (city && data.instant_foods) {
      list.innerHTML = `
        <div class="result-box">
          <h3>⚡ Instant Foods in ${data.city}</h3>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:1rem;">
            ${data.instant_foods.map(f => `<span class="badge badge-medium" style="font-size:1rem; padding:8px 16px;">🍽️ ${f}</span>`).join("")}
          </div>
        </div>`;
    } else {
      list.innerHTML = Object.entries(data).map(([c, foods]) => `
        <div class="result-box" style="margin-bottom:1rem;">
          <h3>📍 ${c}</h3>
          <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;">
            ${foods.map(f => `<span class="badge badge-low">🍽️ ${f}</span>`).join("")}
          </div>
        </div>`).join("");
    }
  }

  loadTemples();
</script>
</body>
</html>
