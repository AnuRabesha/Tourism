<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Booking – TourEase</title>
  <link rel="stylesheet" href="/static/frontend/css/style.css"/>
  <style>
    body { background: linear-gradient(135deg, #ecfdf5 0%, #e0f2fe 50%, #f0e7ff 100%) fixed; }
    .page-header { background: linear-gradient(135deg, #059669, #10b981, #0ea5e9, #7c3aed); }
    .card { border-top: 3px solid; border-image: linear-gradient(90deg,#10b981,#0ea5e9) 1; }
    .card .icon { filter: drop-shadow(0 4px 8px rgba(16,185,129,0.45)); }
    .card p[style*="color:var(--primary)"] { background: linear-gradient(90deg,#059669,#0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .btn-primary { background: linear-gradient(135deg,#059669,#0ea5e9); border: none; }
    .btn-accent { background: linear-gradient(135deg,#f59e0b,#ef4444); border: none; }
    .btn-outline { border-color: #059669; color: #059669; }
    .result-box h3 { background: linear-gradient(90deg,#059669,#0ea5e9); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    th { background: linear-gradient(90deg,#059669,#0ea5e9); }
    tr:hover td { background: #ecfdf5; }
    footer { background: linear-gradient(135deg,#1e1b4b,#4c1d95); }
  </style>
</head>
<body>

<nav>
  <a class="logo" href="/">🌍 TourEase</a>
  <ul>
    <li><a href="/">Home</a></li>
    <li><a href="/pages/weather.html">Weather</a></li>
    <li><a href="/pages/safety.html">Safety</a></li>
    <li><a href="/pages/food.html">Food</a></li>
    <li><a href="/pages/language.html">Language</a></li>
    <li><a href="/pages/booking.html">Booking</a></li>
    <li><a href="/pages/alerts.html" style="background:rgba(220,38,38,0.25);border-radius:20px;">?? Alerts</a></li>`n    <li><a href="#" id="navUser" style="color:#fff; font-weight:700;"></a></li>
    <li><a href="#" onclick="logout()" style="background:rgba(255,255,255,0.15); border-radius:20px;">Logout</a></li>
  </ul>
</nav>

<div class="page-header">
  <h1>📅 Booking</h1>
  <p>Find hotels, transport options and pre-book your trip</p>
</div>

<div class="section">

  <!-- Tabs -->
  <div style="display:flex; gap:1rem; margin-bottom:1.5rem; flex-wrap:wrap;">
    <button class="btn btn-primary" onclick="showTab('hotels')">🏨 Hotels</button>
    <button class="btn btn-outline" onclick="showTab('transport')">🚌 Transport</button>
    <button class="btn btn-outline" onclick="showTab('prebook')">📋 Pre-Book</button>
    <button class="btn btn-outline" onclick="showTab('mybookings')">📂 My Bookings</button>
  </div>

  <!-- Hotels -->
  <div id="hotelsTab">
    <div class="form-card" style="margin:0 0 1.5rem;">
      <div class="form-group">
        <label>City</label>
        <input type="text" id="hotelCity" placeholder="e.g. Chennai, Madurai"/>
      </div>
      <button class="btn btn-primary" onclick="loadHotels()">Search Hotels</button>
    </div>
    <div id="hotelList"></div>
  </div>

  <!-- Transport -->
  <div id="transportTab" style="display:none;">
    <div class="form-card" style="margin:0 0 1.5rem;">
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="form-group">
          <label>From</label>
          <input type="text" id="transportFrom" placeholder="e.g. Chennai"/>
        </div>
        <div class="form-group">
          <label>To</label>
          <input type="text" id="transportTo" placeholder="e.g. Madurai"/>
        </div>
      </div>
      <button class="btn btn-primary" onclick="loadTransport()">Find Transport</button>
    </div>
    <div id="transportList"></div>
  </div>

  <!-- Pre-Book -->
  <div id="prebookTab" style="display:none;">
    <div class="form-card">
      <h3 style="margin-bottom:1.2rem; color:var(--primary);">Pre-Book a Service</h3>
      <div class="form-group">
        <label>Type</label>
        <select id="bookType">
          <option value="Hotel">Hotel</option>
          <option value="Transport">Transport</option>
        </select>
      </div>
      <div class="form-group">
        <label>Name (Hotel / Route)</label>
        <input type="text" id="bookName" placeholder="e.g. Grand Palace Hotel"/>
      </div>
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="bookUser" placeholder="e.g. Ravi Kumar"/>
      </div>
      <div class="form-group">
        <label>Date</label>
        <input type="date" id="bookDate"/>
      </div>
      <div class="form-group">
        <label>Guests</label>
        <input type="number" id="bookGuests" value="1" min="1"/>
      </div>
      <button class="btn btn-accent" onclick="preBook()">Confirm Booking</button>
      <div id="bookResult" style="margin-top:1rem;"></div>
    </div>
  </div>

  <!-- My Bookings -->
  <div id="mybookingsTab" style="display:none;">
    <div class="form-card" style="margin:0 0 1.5rem;">
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="myBookingUser" placeholder="e.g. Ravi Kumar"/>
      </div>
      <button class="btn btn-primary" onclick="loadMyBookings()">View Bookings</button>
    </div>
    <div id="myBookingList"></div>
  </div>

</div>

<footer>© 2025 TourEase</footer>

<script src="/static/frontend/js/api.js"></script>
<script>
  if (!sessionStorage.getItem("tourease_user")) { window.location.href = "/login"; }
  else { const u = JSON.parse(sessionStorage.getItem("tourease_user")); const el = document.getElementById("navUser"); if(el) el.textContent = "👤 " + (u.name||u.email); }
  function logout() { sessionStorage.removeItem("tourease_user"); window.location.href = "/login"; }
  function showTab(tab) {
    ["hotels","transport","prebook","mybookings"].forEach(t => {
      document.getElementById(t + "Tab").style.display = t === tab ? "block" : "none";
    });
  }

  async function loadHotels() {
    const city = document.getElementById("hotelCity").value.trim();
    const url = city ? `/booking/hotels?city=${encodeURIComponent(city)}` : "/booking/hotels";
    const data = await api.get(url);
    const list = document.getElementById("hotelList");
    if (data.error || !Array.isArray(data)) {
      list.innerHTML = `<div class="alert alert-error">${data.error || "Failed to load hotels."}</div>`;
      return;
    }
    if (!data.length) { list.innerHTML = `<div class="alert alert-info">No hotels found.</div>`; return; }
    list.innerHTML = `<div class="cards-grid">${data.map(h => `
      <div class="card" style="cursor:pointer;" onclick="showHotelDetail(${h.id})">
        <div class="icon">🏨</div>
        <h3>${h.name}</h3>
        <p>📍 ${h.city}</p>
        <p style="margin-top:6px; font-weight:700; color:var(--primary);">₹${h.rooms[0].price}/night</p>
        <p style="font-size:0.85rem; color:#888;">⭐ ${h.rating}</p>
        <p style="margin-top:6px; font-size:0.85rem;">
          ${h.total_available > 0
            ? `<span style="color:green;">✅ ${h.total_available} rooms available</span>`
            : `<span style="color:red;">❌ Fully Booked</span>`}
        </p>
        <p style="font-size:0.78rem; color:#666; margin-top:4px;">🍽️ ${h.instant_food.slice(0,3).join(", ")}...</p>
      </div>`).join("")}</div>`;
  }

  async function showHotelDetail(id) {
    const h = await api.get(`/booking/hotels/${id}`);
    if (h.error) return;
    const list = document.getElementById("hotelList");
    list.innerHTML = `
      <div class="result-box">
        <button class="btn btn-outline" onclick="loadHotels()" style="margin-bottom:1rem;">← Back</button>
        <h3>🏨 ${h.name} — ${h.city}</h3>
        <p>⭐ ${h.rating} &nbsp;|&nbsp; ${h.amenities.join(" • ")}</p>

        <h4 style="margin-top:1.2rem;">🛏️ Room Availability</h4>
        <table style="margin-top:0.5rem; width:100%;">
          <thead><tr><th>Room Type</th><th>Price/Night</th><th>Available</th></tr></thead>
          <tbody>${h.rooms.map(r => `
            <tr>
              <td>${r.type}</td>
              <td>₹${r.price}</td>
              <td>${r.available > 0
                ? `<span style="color:green;">✅ ${r.available}</span>`
                : `<span style="color:red;">❌ Full</span>`}
              </td>
            </tr>`).join("")}
          </tbody>
        </table>

        <h4 style="margin-top:1.2rem;">🍽️ Instant Foods Available</h4>
        <div style="display:flex; flex-wrap:wrap; gap:8px; margin-top:0.5rem;">
          ${h.instant_food.map(f => `<span class="badge badge-medium">${f}</span>`).join("")}
        </div>

        <button class="btn btn-accent" style="margin-top:1.2rem;"
          onclick="document.getElementById('bookName').value='${h.name}'; document.getElementById('bookType').value='Hotel'; showTab('prebook')">
          📋 Book This Hotel
        </button>
      </div>`;
  }

  async function loadTransport() {
    const origin = document.getElementById("transportFrom").value.trim();
    const destination = document.getElementById("transportTo").value.trim();
    const list = document.getElementById("transportList");
    if (!origin || !destination) {
      list.innerHTML = `<div class="alert alert-error">Enter both origin and destination.</div>`;
      return;
    }
    const data = await api.get(`/booking/transport?origin=${encodeURIComponent(origin)}&destination=${encodeURIComponent(destination)}`);
    if (data.error) {
      list.innerHTML = `<div class="alert alert-error">${data.error}</div>`;
      return;
    }
    // Guard: options must be an array before calling .map
    if (!Array.isArray(data.options)) {
      list.innerHTML = `<div class="alert alert-error">Invalid transport data received.</div>`;
      return;
    }
    list.innerHTML = `
      <div class="result-box">
        <h3>${data.origin} → ${data.destination}</h3>
        <table style="margin-top:1rem;">
          <thead><tr><th>Type</th><th>Operator</th><th>Duration</th><th>Price</th></tr></thead>
          <tbody>${data.options.map(o => `
            <tr><td>${o.type}</td><td>${o.operator}</td><td>${o.duration}</td><td>₹${o.price}</td></tr>
          `).join("")}</tbody>
        </table>
      </div>`;
  }

  async function preBook() {
    const body = {
      type: document.getElementById("bookType").value,
      name: document.getElementById("bookName").value.trim(),
      user_name: document.getElementById("bookUser").value.trim(),
      date: document.getElementById("bookDate").value,
      guests: parseInt(document.getElementById("bookGuests").value),
    };
    const box = document.getElementById("bookResult");
    if (!body.name || !body.user_name || !body.date) {
      box.innerHTML = `<div class="alert alert-error">Please fill all required fields.</div>`; return;
    }
    const data = await api.post("/booking/pre-book", body);
    if (data.booking) {
      box.innerHTML = `
        <div class="alert alert-success">
          ✅ Booking confirmed! ID: <b>#${data.booking.booking_id}</b> — ${data.booking.name} on ${data.booking.date}
        </div>`;
    } else {
      box.innerHTML = `<div class="alert alert-error">${data.error || "Booking failed."}</div>`;
    }
  }

  async function loadMyBookings() {
    const user = document.getElementById("myBookingUser").value.trim();
    const list = document.getElementById("myBookingList");
    if (!user) {
      list.innerHTML = `<div class="alert alert-error">Enter your name to view bookings.</div>`;
      return;
    }
    const data = await api.get(`/booking/bookings/${encodeURIComponent(user)}`);
    if (data.error || !Array.isArray(data)) {
      list.innerHTML = `<div class="alert alert-error">${data.error || "Failed to load bookings."}</div>`;
      return;
    }
    if (!data.length) { list.innerHTML = `<div class="alert alert-info">No bookings found for "${user}".</div>`; return; }
    list.innerHTML = `
      <div class="result-box">
        <h3>Bookings for ${user}</h3>
        <table style="margin-top:1rem;">
          <thead><tr><th>#ID</th><th>Type</th><th>Name</th><th>Date</th><th>Guests</th><th>Status</th></tr></thead>
          <tbody>${data.map(b => `
            <tr>
              <td>${b.booking_id}</td><td>${b.type}</td><td>${b.name}</td>
              <td>${b.date}</td><td>${b.guests}</td>
              <td><span class="badge badge-low">${b.status}</span></td>
            </tr>`).join("")}
          </tbody>
        </table>
      </div>`;
  }

  loadHotels();
</script>
</body>
</html>
